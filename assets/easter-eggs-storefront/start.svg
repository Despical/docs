 <g opacity=".5"><path transform="translate(1205 70) scale(1.5)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ff8fc8" fill-opacity=".09"/><path transform="translate(1150 128) scale(0.9)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ffd27a" fill-opacity=".08"/><path transform="translate(80 490) scale(1.3)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#5fd6ff" fill-opacity=".08"/><path transform="translate(140 530) scale(0.8)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#7ff0b8" fill-opacity=".07"/></g><rect x="24" y="24" width="1232" height="512" rx="25" fill="#231d44" fill-opacity=".45" stroke="#a99be0" stroke-opacity=".18"/><path d="M80 162H1200" stroke="#e8c27a" stroke-opacity=".3"/><text x="640" y="97" text-anchor="middle" fill="#fff4e4" font-size="41" font-weight="bold">Up and running in minutes.</text><text x="640" y="140" text-anchor="middle" fill="#d3cde6" font-size="20">Bundled hunts, eggs, effects and rewards are ready on first start.</text>
 <rect x="64" y="206" width="270" height="228" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><circle cx="110" cy="256" r="24" fill="#1a1631" stroke="#ffd27a"/><text x="110" y="265" text-anchor="middle" fill="#ffd27a" font-size="22" font-weight="bold">1</text><text x="90" y="330" fill="#fff4e4" font-size="21" font-weight="bold">Drop in the JAR</text><text x="90" y="372" fill="#d3cde6" font-size="17">Paper 1.21.11+</text><text x="90" y="400" fill="#d3cde6" font-size="17">and Java 25.</text><rect x="357" y="206" width="270" height="228" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><circle cx="403" cy="256" r="24" fill="#1a1631" stroke="#ffd27a"/><text x="403" y="265" text-anchor="middle" fill="#ffd27a" font-size="22" font-weight="bold">2</text><text x="383" y="330" fill="#fff4e4" font-size="21" font-weight="bold">Open /eggs admin</text><text x="383" y="372" fill="#d3cde6" font-size="17">Pick a hunt and</text><text x="383" y="400" fill="#d3cde6" font-size="17">a template.</text><rect x="650" y="206" width="270" height="228" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><circle cx="696" cy="256" r="24" fill="#1a1631" stroke="#ffd27a"/><text x="696" y="265" text-anchor="middle" fill="#ffd27a" font-size="22" font-weight="bold">3</text><text x="676" y="330" fill="#fff4e4" font-size="21" font-weight="bold">Place your eggs</text><text x="676" y="372" fill="#d3cde6" font-size="17">Like any block. The</text><text x="676" y="400" fill="#d3cde6" font-size="17">editor does the rest.</text><rect x="943" y="206" width="270" height="228" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><circle cx="989" cy="256" r="24" fill="#1a1631" stroke="#ffd27a"/><text x="989" y="265" text-anchor="middle" fill="#ffd27a" font-size="22" font-weight="bold">4</text><text x="969" y="330" fill="#fff4e4" font-size="21" font-weight="bold">Let them hunt</text><text x="969" y="372" fill="#d3cde6" font-size="17">Players use /eggs to</text><text x="969" y="400" fill="#d3cde6" font-size="17">track every reward.</text>
 <text x="640" y="500" text-anchor="middle" fill="#ffd27a" font-size="17" font-weight="bold" letter-spacing=".5">FULL DOCUMENTATION AT DOCS.DESPICAL.DEV/EASTER-EGGS</text></g></svg>