<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><defs>
 <linearGradient id="night" x2="1" y2="1"><stop stop-color="#181430"/><stop offset=".55" stop-color="#211c3f"/><stop offset="1" stop-color="#14302f"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#c48a3e"/><stop offset=".5" stop-color="#ffe2a0"/><stop offset="1" stop-color="#c79049"/></linearGradient>
 <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#2d2752"/><stop offset="1" stop-color="#1f2a40"/></linearGradient>
 <linearGradient id="code" x2="1" y2="1"><stop stop-color="#141226"/><stop offset="1" stop-color="#191a30"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b9a8ff" stroke-opacity=".05"/></pattern>
 <radialGradient id="hot"><stop stop-color="#ff7a6b" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a6b" stop-opacity=".18"/></radialGradient>
 <radialGradient id="warm"><stop stop-color="#f2b45a" stop-opacity=".2"/><stop offset="1" stop-color="#f2b45a" stop-opacity=".12"/></radialGradient>
 <radialGradient id="cold"><stop stop-color="#5fb3e6" stop-opacity=".12"/><stop offset="1" stop-color="#5fb3e6" stop-opacity=".05"/></radialGradient>
</defs><g font-family="Verdana,DejaVu Sans,sans-serif"><rect width="1280" height="760" rx="24" fill="url(#night)"/><rect width="1280" height="760" rx="24" fill="url(#grid)"/>
 <g opacity=".5"><path transform="translate(1205 70) scale(1.5)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ff8fc8" fill-opacity=".09"/><path transform="translate(1150 128) scale(0.9)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ffd27a" fill-opacity=".08"/><path transform="translate(80 690) scale(1.3)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#5fd6ff" fill-opacity=".08"/><path transform="translate(140 730) scale(0.8)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#7ff0b8" fill-opacity=".07"/></g><rect x="24" y="24" width="1232" height="712" rx="25" fill="#231d44" fill-opacity=".45" stroke="#a99be0" stroke-opacity=".18"/><path d="M80 162H1200" stroke="#e8c27a" stroke-opacity=".3"/><text x="640" y="97" text-anchor="middle" fill="#fff4e4" font-size="41" font-weight="bold">Built to keep your data safe.</text><text x="640" y="140" text-anchor="middle" fill="#d3cde6" font-size="20">SQLite out of the box, MySQL when you need it, and a guided upgrade path.</text>
 <rect x="64" y="206" width="360" height="200" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><text x="92" y="252" fill="#fff4e4" font-size="24" font-weight="bold">SQLite</text><text x="92" y="292" fill="#d3cde6" font-size="17">Zero setup. One file,</text><text x="92" y="320" fill="#d3cde6" font-size="17">write-ahead logging.</text><text x="92" y="372" fill="#7ff0b8" font-size="15" font-weight="bold">DEFAULT</text>
 <rect x="64" y="430" width="360" height="200" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><text x="92" y="476" fill="#fff4e4" font-size="24" font-weight="bold">MySQL</text><text x="92" y="516" fill="#d3cde6" font-size="17">Your own database server,</text><text x="92" y="544" fill="#d3cde6" font-size="17">verified TLS supported.</text><text x="92" y="596" fill="#5fd6ff" font-size="15" font-weight="bold">BUILT IN, NO EXTRA PLUGIN</text>
 <rect x="456" y="206" width="760" height="424" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><text x="488" y="252" fill="#ffd27a" font-size="18" font-weight="bold" letter-spacing="1">UPGRADING FROM AN OLDER VERSION</text>
 <rect x="488" y="286" width="150" height="150" rx="12" fill="#1a1631" stroke="#ffd27a" stroke-opacity=".5"/><text x="563" y="340" text-anchor="middle" fill="#ffd27a" font-size="30" font-weight="bold">1</text><text x="563" y="378" text-anchor="middle" fill="#fff4e4" font-size="18" font-weight="bold">Old folder</text><path d="M642 361h20m-6 -6l6 6l-6 6" stroke="#ffd27a" stroke-width="2" fill="none"/><text x="563" y="466" text-anchor="middle" fill="#d3cde6" font-size="13">Rename the old plugin</text><rect x="668" y="286" width="150" height="150" rx="12" fill="#1a1631" stroke="#ffd27a" stroke-opacity=".5"/><text x="743" y="340" text-anchor="middle" fill="#ffd27a" font-size="30" font-weight="bold">2</text><text x="743" y="378" text-anchor="middle" fill="#fff4e4" font-size="18" font-weight="bold">Backup</text><path d="M822 361h20m-6 -6l6 6l-6 6" stroke="#ffd27a" stroke-width="2" fill="none"/><text x="743" y="466" text-anchor="middle" fill="#d3cde6" font-size="13">Copied before reading</text><rect x="848" y="286" width="150" height="150" rx="12" fill="#1a1631" stroke="#ffd27a" stroke-opacity=".5"/><text x="923" y="340" text-anchor="middle" fill="#ffd27a" font-size="30" font-weight="bold">3</text><text x="923" y="378" text-anchor="middle" fill="#fff4e4" font-size="18" font-weight="bold">Import</text><path d="M1002 361h20m-6 -6l6 6l-6 6" stroke="#ffd27a" stroke-width="2" fill="none"/><text x="923" y="466" text-anchor="middle" fill="#d3cde6" font-size="13">Eggs and progress</text><rect x="1028" y="286" width="150" height="150" rx="12" fill="#1a1631" stroke="#ffd27a" stroke-opacity=".5"/><text x="1103" y="340" text-anchor="middle" fill="#ffd27a" font-size="30" font-weight="bold">4</text><text x="1103" y="378" text-anchor="middle" fill="#fff4e4" font-size="18" font-weight="bold">Report</text><text x="1103" y="466" text-anchor="middle" fill="#d3cde6" font-size="13">Imported, skipped, why</text>
 <text x="488" y="532" fill="#d3cde6" font-size="17">Old egg types, locations and player discoveries are imported.</text>
 <text x="488" y="562" fill="#d3cde6" font-size="17">History never pays rewards twice. The original stays untouched.</text>
 <text x="488" y="602" fill="#a79fc4" font-size="15">One console command. Clear instructions if something is wrong.</text>
 <text x="640" y="700" text-anchor="middle" fill="#ffd27a" font-size="17" font-weight="bold" letter-spacing=".5">VALIDATED RELOADS  •  CRASH-SAFE CLAIMS  •  NOTHING OVERWRITTEN</text></g></svg>