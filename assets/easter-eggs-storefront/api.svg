 <g font-family="Consolas,'Courier New',monospace" font-size="18"><text x="92" y="290" xml:space="preserve"><tspan fill="#c39bff">@EventHandler</tspan><tspan fill="#e6e1f5">(ignoreCancelled = </tspan><tspan fill="#c39bff">true</tspan><tspan fill="#e6e1f5">)</tspan></text><text x="92" y="322" xml:space="preserve"><tspan fill="#c39bff">public void </tspan><tspan fill="#e6e1f5">onCollect(</tspan><tspan fill="#7fd6ff">EggCollectEvent </tspan><tspan fill="#e6e1f5">event) {</tspan></text><text x="92" y="354" xml:space="preserve"><tspan fill="#e6e1f5">    </tspan><tspan fill="#c39bff">if </tspan><tspan fill="#e6e1f5">(event.egg().hunt().equals(</tspan><tspan fill="#ffd27a">"easter"</tspan><tspan fill="#e6e1f5">)</tspan></text><text x="92" y="386" xml:space="preserve"><tspan fill="#e6e1f5">        &amp;&amp; !event.getPlayer().hasPermission(</tspan><tspan fill="#ffd27a">"vip"</tspan><tspan fill="#e6e1f5">)) {</tspan></text><text x="92" y="418" xml:space="preserve"><tspan fill="#e6e1f5">        event.setCancelled(</tspan><tspan fill="#c39bff">true</tspan><tspan fill="#e6e1f5">);</tspan></text><text x="92" y="450" xml:space="preserve"><tspan fill="#e6e1f5">    }</tspan></text><text x="92" y="482" xml:space="preserve"><tspan fill="#e6e1f5">}</tspan></text><text x="92" y="514" xml:space="preserve"><tspan fill="#e6e1f5"></tspan></text><text x="92" y="546" xml:space="preserve"><tspan fill="#7d7a99">// Non-blocking queries, immutable snapshots</tspan></text><text x="92" y="578" xml:space="preserve"><tspan fill="#e6e1f5">api.leaderboard(</tspan><tspan fill="#ffd27a">"enchanted"</tspan><tspan fill="#e6e1f5">, </tspan><tspan fill="#c39bff">null</tspan><tspan fill="#e6e1f5">, </tspan><tspan fill="#c39bff">true</tspan><tspan fill="#e6e1f5">, 3)</tspan></text><text x="92" y="610" xml:space="preserve"><tspan fill="#e6e1f5">    .thenAccept(top -&gt; ...);</tspan></text></g>
