<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780"><defs>
 <linearGradient id="night" x2="1" y2="1"><stop stop-color="#181430"/><stop offset=".55" stop-color="#211c3f"/><stop offset="1" stop-color="#14302f"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#c48a3e"/><stop offset=".5" stop-color="#ffe2a0"/><stop offset="1" stop-color="#c79049"/></linearGradient>
 <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#2d2752"/><stop offset="1" stop-color="#1f2a40"/></linearGradient>
 <linearGradient id="code" x2="1" y2="1"><stop stop-color="#141226"/><stop offset="1" stop-color="#191a30"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b9a8ff" stroke-opacity=".05"/></pattern>
 <radialGradient id="hot"><stop stop-color="#ff7a6b" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a6b" stop-opacity=".18"/></radialGradient>
 <radialGradient id="warm"><stop stop-color="#f2b45a" stop-opacity=".2"/><stop offset="1" stop-color="#f2b45a" stop-opacity=".12"/></radialGradient>
 <radialGradient id="cold"><stop stop-color="#5fb3e6" stop-opacity=".12"/><stop offset="1" stop-color="#5fb3e6" stop-opacity=".05"/></radialGradient>
</defs><g font-family="Verdana,DejaVu Sans,sans-serif"><rect width="1280" height="780" rx="24" fill="url(#night)"/><rect width="1280" height="780" rx="24" fill="url(#grid)"/>
 <g opacity=".5"><path transform="translate(1205 70) scale(1.5)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ff8fc8" fill-opacity=".09"/><path transform="translate(1150 128) scale(0.9)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ffd27a" fill-opacity=".08"/><path transform="translate(80 710) scale(1.3)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#5fd6ff" fill-opacity=".08"/><path transform="translate(140 750) scale(0.8)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#7ff0b8" fill-opacity=".07"/></g><rect x="24" y="24" width="1232" height="732" rx="25" fill="#231d44" fill-opacity=".45" stroke="#a99be0" stroke-opacity=".18"/><path d="M80 162H1200" stroke="#e8c27a" stroke-opacity=".3"/><text x="640" y="97" text-anchor="middle" fill="#fff4e4" font-size="41" font-weight="bold">Every hunt plays by its own rules.</text><text x="640" y="140" text-anchor="middle" fill="#d3cde6" font-size="20">Mix and match per hunt. Progress, rewards and rankings stay separate.</text>
 <rect x="64" y="200" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(108 252) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#7ff0b8" /><text x="144" y="260" fill="#fff4e4" font-size="22" font-weight="bold">Free exploration</text><text x="92" y="318" fill="#d3cde6" font-size="18">Find eggs in any order.</text><text x="92" y="348" fill="#d3cde6" font-size="18">Progress saves as you go.</text><rect x="460" y="200" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(504 252) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ffd27a" /><text x="540" y="260" fill="#fff4e4" font-size="22" font-weight="bold">Ordered trail</text><text x="488" y="318" fill="#d3cde6" font-size="18">Each egg unlocks the next.</text><text x="488" y="348" fill="#d3cde6" font-size="18">Clues follow the trail.</text><rect x="856" y="200" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(900 252) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ff8fc8" /><text x="936" y="260" fill="#fff4e4" font-size="22" font-weight="bold">Timed challenge</text><text x="884" y="318" fill="#d3cde6" font-size="18">Start, race the clock, retry.</text><text x="884" y="348" fill="#d3cde6" font-size="18">Personal and server records.</text><rect x="64" y="436" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(108 488) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#5fd6ff" /><text x="144" y="496" fill="#fff4e4" font-size="22" font-weight="bold">Shared race</text><text x="92" y="554" fill="#d3cde6" font-size="18">First finder claims each egg.</text><text x="92" y="584" fill="#d3cde6" font-size="18">Every egg is fair game again</text><text x="92" y="614" fill="#d3cde6" font-size="18">when a new period starts.</text><rect x="460" y="436" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(504 488) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#ffab40" /><text x="540" y="496" fill="#fff4e4" font-size="22" font-weight="bold">Scheduled seasons</text><text x="488" y="554" fill="#d3cde6" font-size="18">Opens and closes on its own.</text><text x="488" y="584" fill="#d3cde6" font-size="18">Top ranks are rewarded</text><text x="488" y="614" fill="#d3cde6" font-size="18">when the season ends.</text><rect x="856" y="436" width="360" height="212" rx="14" fill="url(#surface)" stroke="#a99be0" stroke-opacity=".32" /><path transform="translate(900 488) scale(0.62)" d="M0 -26C13 -26 22 -6 22 8C22 21 12 28 0 28C-12 28 -22 21 -22 8C-22 -6 -13 -26 0 -26Z" fill="#c39bff" /><text x="936" y="496" fill="#fff4e4" font-size="22" font-weight="bold">Repeat periods</text><text x="884" y="554" fill="#d3cde6" font-size="18">Once, daily, weekly or</text><text x="884" y="584" fill="#d3cde6" font-size="18">after a cooldown. Rewards</text><text x="884" y="614" fill="#d3cde6" font-size="18">renew only with a period.</text>
 <text x="640" y="728" text-anchor="middle" fill="#ffd27a" font-size="17" font-weight="bold" letter-spacing=".5">ENTRY RULES:  PERMISSIONS  •  COMPLETED HUNTS  •  PLACEHOLDERAPI VALUES</text></g></svg>