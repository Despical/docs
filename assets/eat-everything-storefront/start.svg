<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500"><defs>
 <linearGradient id="night" x2="1" y2="1"><stop stop-color="#1b1410"/><stop offset=".55" stop-color="#271a12"/><stop offset="1" stop-color="#1a2a22"/></linearGradient>
 <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#33241a"/><stop offset="1" stop-color="#26301f"/></linearGradient>
 <linearGradient id="code" x2="1" y2="1"><stop stop-color="#15100d"/><stop offset="1" stop-color="#17201b"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffd9a0" stroke-opacity=".05"/></pattern>
</defs><g font-family="Verdana,DejaVu Sans,sans-serif"><rect width="1280" height="500" rx="24" fill="url(#night)"/><rect width="1280" height="500" rx="24" fill="url(#grid)"/><rect x="24" y="24" width="1232" height="452" rx="25" fill="#2a1e15" fill-opacity=".45" stroke="#ffcf8a" stroke-opacity=".18"/><path d="M80 162H1200" stroke="#e8b06a" stroke-opacity=".3"/><text x="640" y="97" text-anchor="middle" fill="#fff1dc" font-size="41" font-weight="bold">Up and running in minutes</text><text x="640" y="140" text-anchor="middle" fill="#e3d3c0" font-size="20">Four steps from an empty plugins folder to your first food.</text>
 <rect x="64" y="196" width="276" height="270" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><circle cx="112" cy="252" r="26" fill="#1d1510" stroke="#ffb347" stroke-width="2"/><text x="112" y="261" text-anchor="middle" fill="#ffb347" font-size="26" font-weight="bold">1</text><text x="88" y="318" fill="#fff1dc" font-size="21" font-weight="bold">Install</text><text x="88" y="352" fill="#e3d3c0" font-size="15" >Place the JAR in your</text><text x="88" y="378" fill="#e3d3c0" font-size="15" >plugins folder and</text><text x="88" y="404" fill="#e3d3c0" font-size="15" >restart the server.</text>
 <rect x="364" y="196" width="276" height="270" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><circle cx="412" cy="252" r="26" fill="#1d1510" stroke="#76f5a4" stroke-width="2"/><text x="412" y="261" text-anchor="middle" fill="#76f5a4" font-size="26" font-weight="bold">2</text><text x="388" y="318" fill="#fff1dc" font-size="21" font-weight="bold">Prototype</text><text x="388" y="352" fill="#e3d3c0" font-size="15" >Hold any item and run</text><text x="388" y="378" fill="#91d7e3" font-size="15" font-family="Consolas,DejaVu Sans Mono,monospace">/ee nutrition 6</text><text x="388" y="404" fill="#91d7e3" font-size="15" font-family="Consolas,DejaVu Sans Mono,monospace">/ee effect add speed 200 1</text>
 <rect x="664" y="196" width="276" height="270" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><circle cx="712" cy="252" r="26" fill="#1d1510" stroke="#7fffe1" stroke-width="2"/><text x="712" y="261" text-anchor="middle" fill="#7fffe1" font-size="26" font-weight="bold">3</text><text x="688" y="318" fill="#fff1dc" font-size="21" font-weight="bold">Define</text><text x="688" y="352" fill="#e3d3c0" font-size="15" >Add a food to</text><text x="688" y="378" fill="#e3d3c0" font-size="15" >food-components.yml</text><text x="688" y="404" fill="#e3d3c0" font-size="15" >and run /ee reload.</text>
 <rect x="964" y="196" width="276" height="270" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><circle cx="1012" cy="252" r="26" fill="#1d1510" stroke="#ffd166" stroke-width="2"/><text x="1012" y="261" text-anchor="middle" fill="#ffd166" font-size="26" font-weight="bold">4</text><text x="988" y="318" fill="#fff1dc" font-size="21" font-weight="bold">Share</text><text x="988" y="352" fill="#e3d3c0" font-size="15" >Hand it out with</text><text x="988" y="378" fill="#91d7e3" font-size="15" font-family="Consolas,DejaVu Sans Mono,monospace">/ee item &lt;id&gt;</text><text x="988" y="404" fill="#e3d3c0" font-size="15" >or from a command.</text></g></svg>