<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590"><defs>
 <linearGradient id="night" x2="1" y2="1"><stop stop-color="#1b1410"/><stop offset=".55" stop-color="#271a12"/><stop offset="1" stop-color="#1a2a22"/></linearGradient>
 <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#33241a"/><stop offset="1" stop-color="#26301f"/></linearGradient>
 <linearGradient id="code" x2="1" y2="1"><stop stop-color="#15100d"/><stop offset="1" stop-color="#17201b"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffd9a0" stroke-opacity=".05"/></pattern>
</defs><g font-family="Verdana,DejaVu Sans,sans-serif"><rect width="1280" height="590" rx="24" fill="url(#night)"/><rect width="1280" height="590" rx="24" fill="url(#grid)"/><rect x="24" y="24" width="1232" height="542" rx="25" fill="#2a1e15" fill-opacity=".45" stroke="#ffcf8a" stroke-opacity=".18"/><path d="M80 162H1200" stroke="#e8b06a" stroke-opacity=".3"/><text x="640" y="97" text-anchor="middle" fill="#fff1dc" font-size="41" font-weight="bold">Everything a food needs</text><text x="640" y="140" text-anchor="middle" fill="#e3d3c0" font-size="20">Reusable, permission-aware and easy to tune.</text>
 <rect x="64" y="190" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="64" y="208" width="5" height="40" rx="2" fill="#76f5a4"/><text x="88" y="236" fill="#fff1dc" font-size="21" font-weight="bold">Potion effects</text><text x="88" y="270" fill="#e3d3c0" font-size="15">Duration, level, icon and particles.</text><text x="88" y="294" fill="#e3d3c0" font-size="15">Every effect has its own chance.</text>
 <rect x="456" y="190" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="456" y="208" width="5" height="40" rx="2" fill="#ffd166"/><text x="480" y="236" fill="#fff1dc" font-size="21" font-weight="bold">Exact matching</text><text x="480" y="270" fill="#e3d3c0" font-size="15">Name, lore, amount and enchantments.</text><text x="480" y="294" fill="#e3d3c0" font-size="15">A plain stick can stay a stick.</text>
 <rect x="848" y="190" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="848" y="208" width="5" height="40" rx="2" fill="#7fffe1"/><text x="872" y="236" fill="#fff1dc" font-size="21" font-weight="bold">Leftover items</text><text x="872" y="270" fill="#e3d3c0" font-size="15">A bowl after soup, a bottle after</text><text x="872" y="294" fill="#e3d3c0" font-size="15">a drink, or any item you design.</text>
 <rect x="64" y="366" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="64" y="384" width="5" height="40" rx="2" fill="#ffb347"/><text x="88" y="412" fill="#fff1dc" font-size="21" font-weight="bold">Cooldowns</text><text x="88" y="446" fill="#e3d3c0" font-size="15">The hotbar overlay shows when the</text><text x="88" y="470" fill="#e3d3c0" font-size="15">food can be used again.</text>
 <rect x="456" y="366" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="456" y="384" width="5" height="40" rx="2" fill="#ff7777"/><text x="480" y="412" fill="#fff1dc" font-size="21" font-weight="bold">Permissions</text><text x="480" y="446" fill="#e3d3c0" font-size="15">Lock any food behind your own</text><text x="480" y="470" fill="#e3d3c0" font-size="15">permission node.</text>
 <rect x="848" y="366" width="368" height="150" rx="14" fill="url(#surface)" stroke="#ffcf8a" stroke-opacity=".28"/><rect x="848" y="384" width="5" height="40" rx="2" fill="#91d7e3"/><text x="872" y="412" fill="#fff1dc" font-size="21" font-weight="bold">Commands</text><text x="872" y="446" fill="#e3d3c0" font-size="15">Run console or player commands on</text><text x="872" y="470" fill="#e3d3c0" font-size="15">every bite, with placeholders.</text>
 <text x="640" y="562" text-anchor="middle" fill="#ffb347" font-size="17" font-weight="bold" letter-spacing=".5">PAPER 1.21.11 - 26.3   -   JAVA 25   -   PLACEHOLDERAPI OPTIONAL</text></g></svg>