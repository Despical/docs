b347" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">      conditions:</text><text x="96" y="551" fill="#e3d3c0" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">        name: <tspan fill="#ffd166">"&amp;#FFAA00Golden Stick"</tspan></text><text x="96" y="576" fill="#ffb347" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">      converts-to:</text><text x="96" y="601" fill="#e3d3c0" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">        material: <tspan fill="#7fffe1">BOWL</tspan></text><text x="96" y="626" fill="#ffb347" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">      commands:</text><text x="96" y="651" fill="#e3d3c0" font-size="16" font-family="Consolas,DejaVu Sans Mono,monospace" xml:space="preserve">        - <tspan fill="#ffd166">"give %player% diamond 1"</tspan></text>
